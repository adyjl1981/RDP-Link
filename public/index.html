<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><title>RDP-Link</title><link rel="stylesheet" href="/style.css"></head>
<body><main id="home"><p class="eyebrow">YOUR DESKTOP, WITH YOU</p><h1>RDP-Link</h1><p>Connect to your Ubuntu desktop.</p>
<label>Saved desktop<select id="profiles"><option value="">New connection</option></select></label>
<form id="connect"><label>Profile name<input name="name" placeholder="My Ubuntu desktop" maxlength="80"></label><label>Desktop address<input name="host" required placeholder="192.168.1.20" autocapitalize="none" spellcheck="false"></label><div class="row"><label>Port<input name="port" type="number" value="3389" min="1" max="65535" required></label><label>Username<input name="username" required autocomplete="username" autocapitalize="none" spellcheck="false"></label></div><label>RDP password<input name="password" type="password" autocomplete="current-password" required></label><p class="hint">Only the address and username are saved. Enter the RDP password each time.</p><button type="submit">Connect</button><button id="forget" type="button" class="secondary">Forget selected profile</button></form></main>
<section id="session" hidden><header><strong id="desktopName">Desktop</strong><button id="keyboardButton">Keyboard</button><button id="clipboardButton">Clipboard</button><button id="disconnect">Disconnect</button></header><div id="viewport"><div id="display"></div></div><footer>Touch: move pointer · tap: click · two fingers: scroll/right click · hold: drag</footer><textarea id="keyboard" aria-label="Type on remote desktop" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="Tap here to type on Ubuntu"></textarea></section>
<p id="status" role="status" aria-live="polite">Ready to connect</p><dialog id="clipboard"><form method="dialog"><h2>Clipboard</h2><p>Exchange text with your desktop.</p><textarea id="clipboardText" aria-label="Clipboard text" maxlength="65536"></textarea><button id="sendClipboard" type="button">Send to desktop</button><button id="copyClipboard" type="button">Copy to iPhone</button><button>Close</button></form></dialog><script type="module" src="/app.js"></script></body></html>
