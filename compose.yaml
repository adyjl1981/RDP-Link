services:
  gateway:
    build: .
    environment:
      BIND_HOST: 0.0.0.0
      GUACD_HOST: guacd
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      RDP_TARGETS: ${RDP_TARGETS:-host.docker.internal:3389}
      RDP_IGNORE_CERT: ${RDP_IGNORE_CERT:-false}
    ports:
      - "0.0.0.0:8080:8080"
    depends_on:
      - guacd
    restart: unless-stopped
  guacd:
    image: guacamole/guacd:1.6.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
